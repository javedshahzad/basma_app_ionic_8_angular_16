<ion-header class="ion-no-border bg-slate-50" mode="md">
  <ion-toolbar class="--bg-transparent px-2">
    <ion-buttons slot="end">
      <button
        class="w-10 h-10 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center transition-colors focus:outline-none"
        (click)="viewCtrl.dismiss(false)"
      >
        <ion-icon name="close-outline" class="text-xl"></ion-icon>
      </button>
    </ion-buttons>

    <ion-title class="text-slate-800 font-bold text-base text-center">
      {{'createClass.pagetitle' | translate}}
    </ion-title>

    <ion-buttons slot="start" class="w-8"></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-slate-50" mode="md">
  <div class="p-4 md:p-6 max-w-lg mx-auto" dir="rtl">
    <form
      #registerForm="ngForm"
      class="bg-slate-50 rounded-3xl p-5 md:p-6 shadow-[var(--shadow-card-soft)] border border-slate-100 space-y-5"
    >
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-bold text-slate-600">{{'createClass.class_name' | translate}}</label>
          <span
            class="text-xs font-bold transition-colors"
            [ngClass]="class.name?.length === 8 ? 'text-rose-500' : 'text-slate-400'"
          >
            {{ class.name?.length || 0 }} / 8
          </span>
        </div>
        <div
          class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all"
        >
          <ion-input
            type="text"
            name="className"
            #className="ngModel"
            [(ngModel)]="class.name"
            maxlength="8"
            class="text-sm text-slate-800 bg-transparent font-bold"
            [placeholder]="'createClass.class_name' | translate"
            required
          ></ion-input>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-sm font-bold text-slate-600">{{'createClass.class_desc' | translate}}</label>
          <span
            class="text-xs font-bold transition-colors"
            [ngClass]="class.desc?.length === 15 ? 'text-rose-500' : 'text-slate-400'"
          >
            {{ class.desc?.length || 0 }} / 15
          </span>
        </div>
        <div
          class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all"
        >
          <ion-textarea
            name="classDesc"
            #classDesc="ngModel"
            [(ngModel)]="class.desc"
            rows="3"
            maxlength="15"
            class="text-sm text-slate-800 bg-transparent font-medium leading-relaxed"
            [placeholder]="'createClass.class_desc' | translate"
            required
          ></ion-textarea>
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">{{'createClass.seminar' | translate}}</label>
        <div
          class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:bg-slate-50 focus-within:ring-2 focus-within:ring-indigo-100 transition-all flex items-center h-[46px] cursor-pointer"
        >
          <ion-select
            name="seminar"
            #seminar="ngModel"
            [(ngModel)]="class.semno"
            interface="popover"
            mode="md"
            class="w-full text-sm font-bold text-slate-700 m-0 py-0 outline-none"
            required
          >
            @for (seminar of getSeminars(); track $index; let i = $index) {
            <ion-select-option [value]="(i+1)">{{i+1}}</ion-select-option>
            }
          </ion-select>
        </div>
      </div>

      <div class="pt-4 mt-4 border-t border-slate-100">
        <button
          type="button"
          class="w-full font-bold text-base py-3.5 rounded-2xl transition-all flex justify-center items-center gap-2 focus:outline-none"
          [ngClass]="registerForm.form.valid ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-lg shadow-indigo-200 active:scale-95' : 'bg-slate-100 text-slate-400 cursor-not-allowed'"
          [disabled]="!registerForm.form.valid"
          (click)="registerClass()"
        >
          <ion-icon name="checkmark-circle-outline" class="text-xl"></ion-icon>
          {{ 'createClass.create_btn' | translate }}
        </button>
      </div>
    </form>
  </div>
</ion-content>
