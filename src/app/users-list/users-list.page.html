<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    
    <ion-buttons slot="start" class="menu-btn-container">
      <ion-button class="custom-menu-btn primary-action-btn" (click)="addNewUser()">
        <ion-icon name="person-add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="ion-text-center fw-bold text-dark">
      {{'edit_user.title' | translate}}
    </ion-title>

    <ion-buttons slot="end" class="mr-2 w-10 menu-btn-container">
      <ion-back-button defaultHref="/tabs" text="" icon="arrow-back-outline" class="custom-back-btn" [class.transform]="true" [class.-scale-x-100]="lang?.direction === 'rtl'"></ion-back-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md">
  
  <div class="max-w-3xl mx-auto" dir="rtl">
    
    <div class="px-4 pt-4 pb-2 sticky top-0 z-10 bg-[#f8fafc]/90 backdrop-blur-md">
      <div class="flex items-center bg-white border border-slate-200 rounded-2xl px-4 py-1.5 focus-within:border-indigo-500 transition-colors shadow-sm">
        <ion-icon name="search-outline" class="text-slate-400 text-xl"></ion-icon>
        <ion-input type="text" placeholder="{{'search.search_user' | translate}}" [(ngModel)]="userSearchValue" class="text-slate-700 font-medium mr-2" clearInput></ion-input>
      </div>
    </div>

    <div class="px-4 pb-4 flex flex-col gap-3 mt-2" *ngIf="trimmedUsers?.length > 0">
      <div *ngFor="let list of trimmedUsers | userSearch : userSearchValue" 
           (click)="openEditPage(list)"
           class="flex items-center gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm transition-all cursor-pointer hover:shadow-md hover:border-indigo-100 active:scale-[0.98]">
        
        <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-bold text-lg shadow-sm bg-indigo-50 text-indigo-600 border border-indigo-100 shrink-0 overflow-hidden relative">
          <img *ngIf="list.pic" [src]="list.pic" class="w-full h-full object-cover" onerror="this.style.display='none'">
          <span *ngIf="!list.pic">{{ list.first_name ? list.first_name.charAt(0).toUpperCase() : 'U' }}</span>
        </div>
        
        <div class="flex-1 min-w-0">
          <h4 class="text-base font-bold text-slate-800 m-0 truncate">{{list.first_name}}</h4>
          <p class="text-xs text-slate-500 m-0 mt-1 font-medium truncate" dir="ltr">{{list.username}}</p>
        </div>
        
        <ion-icon name="chevron-back-outline" class="text-slate-300 text-xl shrink-0"></ion-icon>
      </div>
    </div>

    <div *ngIf="!trimmedUsers.length || show_loading" class="px-4 pb-4 flex flex-col gap-3 mt-2">
      <div *ngFor="let dummy of [1,2,3,4,5,6,7,8]" class="flex items-center gap-4 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
        <ion-skeleton-text animated style="width: 48px; height: 48px; border-radius: 16px; margin: 0;"></ion-skeleton-text>
        <div class="flex-1">
          <ion-skeleton-text animated style="width: 60%; height: 16px; border-radius: 4px; margin-bottom: 8px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width: 40%; height: 12px; border-radius: 4px; margin: 0;"></ion-skeleton-text>
        </div>
      </div>
    </div>

    <ion-infinite-scroll (ionInfinite)="doInfinite($event)">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="جاري تحميل المزيد..."></ion-infinite-scroll-content>
    </ion-infinite-scroll>

  </div>

</ion-content>
