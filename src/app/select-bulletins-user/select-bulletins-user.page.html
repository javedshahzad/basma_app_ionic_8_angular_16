<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    <ion-buttons slot="end" class="mr-2 w-10">
      <ion-back-button defaultHref="/" text="" icon="chevron-back-outline" class="custom-back-btn"></ion-back-button>
    </ion-buttons>
    
    <ion-title class="ion-text-center fw-bold text-dark">
      {{'bulletin.share' | translate}}
    </ion-title>

    <ion-buttons slot="start" class="w-10"></ion-buttons>
  </ion-toolbar>
  
  <div class="px-4 pb-3 bg-white border-b border-slate-100">
    <div class="bg-slate-50 border border-slate-200 rounded-2xl px-3 py-1 flex items-center focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-sm">
      <ion-icon name="search-outline" class="text-slate-400 text-xl ml-2"></ion-icon>
      <!-- 🟢 الاعتماد على ngModel للبحث الآمن -->
      <input type="text" [(ngModel)]="searchQuery" (keyup)="filterList()" placeholder="{{'search.search_user' | translate}}" class="w-full bg-transparent border-none outline-none text-sm font-bold text-slate-700 placeholder-slate-400 h-10">
    </div>
  </div>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md" dir="rtl">
  <div class="p-4 max-w-2xl mx-auto pb-24">
    
    <!-- 🟢 شاشة التحميل (Skeleton) -->
    <div *ngIf="show_loading" class="space-y-3">
      <div *ngFor="let dummy of [1,2,3,4,5,6]; trackBy: trackByIndex" class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between animate-pulse">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-slate-200 rounded-xl"></div>
          <div class="space-y-2">
            <div class="w-32 h-4 bg-slate-200 rounded"></div>
            <div class="w-20 h-3 bg-slate-200 rounded"></div>
          </div>
        </div>
        <div class="w-6 h-6 bg-slate-200 rounded"></div>
      </div>
    </div>

    <!-- 🟢 حالة المشاركة والتحديد المتعدد -->
    <div *ngIf="!show_loading && allUsers && bulletinId && type!=='create'" class="space-y-3">
      <div *ngFor="let user of allUsers; let i=index; trackBy: trackByIndex" 
           class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer transition-all hover:shadow-md hover:border-indigo-200"
           (click)="user.isChecked = !user.isChecked; selectUser(user, {detail: {checked: user.isChecked}, stopPropagation: false})">
        
        <div class="flex items-center gap-4">
          <div class="relative shrink-0">
            <img loading="lazy" [src]="user.pic" onerror="this.onerror=null;this.src='assets/imgs/default_avatar.png';" class="w-12 h-12 rounded-xl object-cover border border-slate-200 bg-slate-50 shadow-sm">
          </div>
          <div>
            <h4 class="font-bold text-sm text-slate-800 m-0 mb-1">{{user.first_name}}</h4>
            <p class="text-[11px] font-bold text-slate-400 m-0" dir="ltr">{{user.username}}</p> 
          </div>
        </div>

        <ion-checkbox mode="md" [(ngModel)]="user.isChecked" (click)="$event.stopPropagation();" (ionChange)="selectUser(user, $event)" class="lineone-checkbox m-0"></ion-checkbox>

      </div>
    </div>

    <!-- 🟢 حالة الإنشاء المباشر (اختيار شخص واحد) -->
    <div *ngIf="!show_loading && allUsers && type==='create'" class="space-y-3">
      <div *ngFor="let user of allUsers; trackBy: trackByIndex" 
           class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between cursor-pointer transition-all hover:shadow-md hover:border-indigo-200"
           (click)="uplaodBullentin(user)">
        
        <div class="flex items-center gap-4">
          <div class="relative shrink-0">
            <img loading="lazy" [src]="user.pic" onerror="this.onerror=null;this.src='assets/imgs/default_avatar.png';" class="w-12 h-12 rounded-xl object-cover border border-slate-200 bg-slate-50 shadow-sm">
          </div>
          <div>
            <h4 class="font-bold text-sm text-slate-800 m-0 mb-1">{{user.first_name}}</h4>
            <p class="text-[11px] font-bold text-slate-400 m-0" dir="ltr">{{user.username}}</p> 
          </div>
        </div>
        
        <div class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center">
          <ion-icon name="chevron-back-outline" class="text-xl"></ion-icon>
        </div>

      </div>
    </div>

    <!-- 🟢 رسالة عند عدم وجود مستخدمين -->
    <div class="text-center py-20" *ngIf="!show_loading && allUsers?.length === 0">
      <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300 border border-slate-200 shadow-inner">
        <ion-icon name="search-outline" class="text-4xl"></ion-icon>
      </div>
      <h3 class="text-slate-700 font-bold text-lg mb-1">لا توجد نتائج</h3>
      <p class="text-slate-500 text-sm font-medium mt-1 leading-relaxed max-w-xs mx-auto">حاول البحث باسم آخر أو تأكد من إملاء الكلمة بشكل صحيح.</p>
    </div>

  </div>

  <ion-infinite-scroll (ionInfinite)="doInfinite($event)">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<!-- 🟢 شريط الأزرار السفلي يظهر فقط في حالة التحديد المتعدد -->
<ion-footer class="ion-no-border bg-white shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.1)] rounded-t-3xl" *ngIf="type!=='create' && allUsers?.length > 0">
  <div class="p-4 max-w-2xl mx-auto w-full pb-safe">
    <button (click)="uplaodBullentin()" 
            [disabled]="selectedUsers.length === 0"
            class="w-full py-4 rounded-2xl font-black text-white text-base bg-indigo-600 shadow-lg shadow-indigo-200 transition-all active:scale-[0.98] hover:bg-indigo-700 disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed flex items-center justify-center gap-2">
      <ion-icon name="share-social-outline" class="text-xl"></ion-icon>
      {{'bulletin.share' | translate}} <span *ngIf="selectedUsers.length > 0">({{selectedUsers.length}})</span>
    </button>
  </div>
</ion-footer>
