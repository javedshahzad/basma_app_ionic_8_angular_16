<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    <ion-buttons slot="end" class="mr-2 w-10">
      <ion-back-button defaultHref="/" text=""  class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-700 shadow-sm hover:bg-slate-100 transition-all flex items-center justify-center"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center fw-bold text-dark">
      {{ edit ? 'تعديل الخبر' : 'إضافة خبر جديد' }}
    </ion-title>

    <ion-buttons slot="start" class="w-10"></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md" dir="rtl">
  <div class="p-4 md:p-6 lg:p-8 max-w-2xl mx-auto pb-10">
    
    <form #privateMessage='ngForm' class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full relative">
      
      <div class="p-4 md:p-6 bg-slate-50 border-b border-slate-100 relative">
        <label class="block text-xs font-bold text-slate-600 mb-2">عنوان الخبر</label>
        <div class="bg-white border border-slate-200 rounded-xl px-4 h-[46px] flex items-center focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-sm">
          <ion-input type="text" name="title" [(ngModel)]="news.title" required placeholder="اكتب عنوان الخبر هنا..." class="text-sm font-bold text-slate-800 w-full m-0"></ion-input>
        </div>
      </div>

      <div class="p-4 md:p-6 flex-1 flex flex-col">
        <label class="block text-xs font-bold text-slate-600 mb-2">تفاصيل الخبر</label>
        <div class="bg-slate-50 rounded-xl border border-slate-200 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all overflow-hidden flex-1 min-h-[200px]">
          <ion-textarea 
            name="news_description"
            [(ngModel)]="news.news_description" 
            required
            class="m-0 p-4 text-slate-700 h-full w-full" 
            rows="8" 
            placeholder="اكتب تفاصيل الخبر هنا...">
          </ion-textarea>
        </div>

        <div class="mt-6">
          <label class="block text-xs font-bold text-slate-600 mb-3">الصورة المرفقة (اختياري)</label>
          
          <!-- 🟢 التعديل الأول: استخدام !safeUrl بدلاً من !media لإظهار زر الإضافة -->
          <div *ngIf="!safeUrl" (click)="takePicture()" class="border-2 border-dashed border-slate-200 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 hover:border-indigo-300 transition-all group">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
              <ion-icon name="cloud-upload-outline" class="text-2xl"></ion-icon>
            </div>
            <h4 class="text-sm font-bold text-slate-700 mb-1">اضغط لإرفاق صورة</h4>
            <p class="text-[11px] font-medium text-slate-400">يدعم JPG, PNG</p>
          </div>

          <!-- 🟢 التعديل الثاني: استخدام safeUrl بدلاً من media لإظهار الصورة -->
          <div *ngIf="safeUrl" class="relative rounded-2xl overflow-hidden border border-slate-200 shadow-sm group bg-slate-100">
            
            <!-- إذا كان المرفق فيديو (نظهر أيقونة فيديو)، وإلا نظهر الصورة -->
            <div *ngIf="mediaKey === 'video'" class="w-full h-48 flex flex-col items-center justify-center cursor-pointer" (click)="openFullscreenImage()">
               <ion-icon name="videocam" class="text-5xl text-indigo-300 mb-2"></ion-icon>
               <span class="text-sm font-bold text-slate-500">تم إرفاق فيديو</span>
            </div>
            
            <img *ngIf="mediaKey !== 'video'" [src]="safeUrl" class="w-full h-48 object-cover cursor-pointer" (click)="openFullscreenImage()">
            
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center cursor-pointer" (click)="openFullscreenImage()">
              <ion-icon name="expand-outline" class="text-white text-3xl"></ion-icon>
            </div>
            <button type="button" (click)="removeImage()" class="absolute top-3 right-3 w-8 h-8 bg-white text-rose-500 rounded-full flex items-center justify-center shadow-md hover:bg-rose-50 transition-colors z-10">
              <ion-icon name="trash-outline" class="text-lg"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <div class="p-4 md:p-6 bg-slate-50 border-t border-slate-100">
        <button class="w-full flex items-center justify-center gap-2 py-3.5 text-sm font-bold text-white bg-indigo-600 rounded-xl hover:bg-indigo-700 shadow-md shadow-indigo-200 transition-all active:scale-[0.98] disabled:opacity-50" 
                [disabled]="privateMessage.invalid"
                (click)="sendNews()">
          <ion-icon name="paper-plane-outline" class="text-xl mr-1 transform -rotate-45" *ngIf="!edit"></ion-icon>
          <ion-icon name="save-outline" class="text-xl mr-1" *ngIf="edit"></ion-icon>
          {{ edit ? 'حفظ التعديلات' : 'نشر الخبر' }}
        </button>
      </div>

    </form>
  </div>
</ion-content>

<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 backdrop-blur-md transition-all duration-300" *ngIf="showImageViewer" (click)="closeFullscreenImage()">
  <button class="absolute top-6 right-6 z-10 w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center backdrop-blur-lg transition-all active:scale-95" (click)="closeFullscreenImage()">
    <ion-icon name="close" class="text-xl"></ion-icon>
  </button>
  <div class="relative w-11/12 max-w-2xl max-h-[85vh] flex items-center justify-center" (click)="$event.stopPropagation()">
    <img [src]="safeUrl" class="max-w-full max-h-[80vh] rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.3)] object-contain border border-white/10">
  </div>
</div>
