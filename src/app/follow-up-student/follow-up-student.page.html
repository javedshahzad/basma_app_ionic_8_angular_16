<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    
    <ion-buttons slot="start" class="menu-btn-container">
      <ion-menu-toggle auto-hide="false">
        <ion-button color="dark" class="custom-menu-btn">
          <ion-icon name="menu-outline"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>

    <ion-title class="ion-text-center fw-bold text-dark">
      {{'followUp_student.title' | translate}}
    </ion-title>

    <ion-buttons slot="end" class="ml-2 w-10">
      <ion-button color="dark" class="custom-menu-btn" (click)="createClass()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    
  </ion-toolbar>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="p-4 max-w-5xl mx-auto" dir="rtl">

    <div class="space-y-3 mt-2" *ngIf="isLoading">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4 animate-pulse" *ngFor="let dummy of [1,2,3,4]; trackBy: trackByIndex">
        <div class="w-14 h-14 bg-slate-200 rounded-xl shrink-0"></div>
        <div class="flex-1 space-y-3">
          <div class="h-4 bg-slate-200 rounded-md w-1/2"></div>
          <div class="h-3 bg-slate-100 rounded-md w-1/3"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2" *ngIf="!isLoading && classes?.length > 0">
      
      <div *ngFor="let course of classes; trackBy: trackByIndex"
           class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center gap-4 cursor-pointer hover:shadow-md hover:border-indigo-200 transition-all active:scale-[0.98] group"
           (click)="openClassStudents(course)">

        <div class="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0 relative overflow-hidden" [style.color]="course.backgroundColor">
          <div class="absolute inset-0 opacity-15" [style.background-color]="course.backgroundColor"></div>
          <ion-icon name="library" class="text-2xl relative z-10 group-hover:scale-110 transition-transform duration-300"></ion-icon>
        </div>

        <div class="flex-1 overflow-hidden">
          <h3 class="text-base font-bold text-slate-800 m-0 mb-1 truncate">{{course.name}}</h3>
          <p class="text-xs font-medium text-slate-500 m-0 line-clamp-2 leading-relaxed">{{course.desc}}</p>
        </div>

        <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 flex-shrink-0 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors">
          <ion-icon name="chevron-back" class="text-lg"></ion-icon>
        </div>
        
      </div>

    </div>

    <div class="flex flex-col items-center justify-center py-20" *ngIf="!isLoading && classes?.length === 0">
      <div class="w-24 h-24 bg-slate-100 border border-slate-200 rounded-3xl flex items-center justify-center text-slate-300 mb-5 shadow-sm">
        <ion-icon name="albums-outline" class="text-5xl"></ion-icon>
      </div>
      <h3 class="text-lg font-bold text-slate-800 mb-2">لا توجد فصول مضافة</h3>
      <p class="text-sm font-medium text-slate-500 text-center max-w-xs leading-relaxed">
        {{noDataFound || 'لم يتم العثور على فصول مسجلة حتى الآن. انقر على زر الإضافة للبدء.'}}
      </p>
    </div>

  </div>
</ion-content>
