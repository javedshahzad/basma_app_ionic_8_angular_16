<div class="w-full h-full flex items-center justify-center">
  <div class="bg-white w-11/12 max-w-sm rounded-3xl overflow-hidden shadow-2xl p-6" dir="rtl">
    <div class="flex flex-col items-center text-center gap-3">
      <div class="w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
        <ion-icon name="people" class="text-3xl"></ion-icon>
      </div>

      <h4 class="text-base font-bold text-slate-800 m-0">{{ generateLang?.generate_progress_title || 'جارٍ إنشاء الطلاب...' }}</h4>
      <p class="text-sm text-slate-500 m-0 truncate w-full">{{ progress().currentLabel }}</p>

      <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden mt-2">
        <div
          class="bg-indigo-600 h-full rounded-full transition-all duration-300 ease-out"
          [style.width.%]="percent()"
        ></div>
      </div>

      <div class="flex justify-between w-full text-xs font-bold text-slate-500 mt-1">
        <span>{{ progress().current }} / {{ progress().total }}</span>
        @if (progress().failed > 0) {
          <span class="text-rose-500">{{ progress().failed }} {{ generateLang?.generate_failed_word || 'فشل' }}</span>
        }
      </div>
    </div>
  </div>
</div>
