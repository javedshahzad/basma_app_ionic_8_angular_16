<div class="w-full h-full flex items-start justify-center pt-[25vh]" (click)="hideModal()">
  
  <div class="bg-white w-11/12 max-w-sm rounded-3xl overflow-hidden shadow-2xl p-6 relative z-10" dir="rtl" (click)="$event.stopPropagation()">
    
    <h4 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
      <ion-icon name="person-add" class="text-indigo-600 bg-indigo-50 p-2 rounded-xl"></ion-icon> 
      {{ addStudentLang?.title || 'إضافة طالب جديد' }}
    </h4>
    
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">{{ addStudentLang?.student_name || 'اسم الطالب' }}</label>
        <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
          <ion-input type="text" [(ngModel)]="newStudentName" [placeholder]="addStudentLang?.student_name || 'أدخل اسم الطالب'" class="text-sm text-slate-800 bg-transparent font-medium"></ion-input>
        </div>
      </div>
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">
          {{ addStudentLang?.student_id || 'رمز الطالب' }}
          <span class="font-medium text-slate-400">({{ addStudentLang?.optional_label || 'اختياري' }})</span>
        </label>
        <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
          <ion-input type="number" [(ngModel)]="newStudentId" [placeholder]="addStudentLang?.student_id_placeholder || 'اتركه فارغاً لإنشاء رقم تلقائي'" class="text-sm text-slate-800 bg-transparent font-medium"></ion-input>
        </div>
        <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">
          {{ addStudentLang?.student_id_hint || 'إذا تركته فارغاً، سينشئ النظام رقماً فريداً تلقائياً لن يتكرر مع أي طالب آخر في أي مدرسة.' }}
        </p>
      </div>
    </div>
    
    <div class="flex gap-3">
      <button class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors" (click)="hideModal()">
        {{ addStudentLang?.cancel || 'إلغاء' }}
      </button>
      <button class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95" (click)="submitNewStudent()">
        {{ addStudentLang?.register || 'إضافة' }}
      </button>
    </div>
    
  </div>
</div>
