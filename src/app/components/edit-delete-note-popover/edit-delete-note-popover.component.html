<div class="p-2 bg-white min-w-[200px]" dir="rtl">
  <div class="mb-2 pb-2 border-b border-slate-100 px-3 pt-2">
    <h3 class="text-sm font-bold text-slate-700 m-0">إجراءات الملاحظة</h3>
  </div>

  <div class="space-y-1">
    <button (click)="close('edit')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-slate-700 transition-all text-right group active:scale-95">
      <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-500 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition-colors shrink-0">
        <ion-icon name="pencil-outline" class="text-lg"></ion-icon>
      </div>
      <span class="text-sm font-bold m-0">{{ 'alertmessages.edit_title' | translate }}</span>
    </button>

    <button (click)="close('delete')" class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-rose-50 text-slate-700 transition-all text-right group active:scale-95">
      <div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-500 flex items-center justify-center group-hover:bg-rose-500 group-hover:text-white transition-colors shrink-0">
        <ion-icon name="trash-outline" class="text-lg"></ion-icon>
      </div>
      <span class="text-sm font-bold m-0 group-hover:text-rose-600 transition-colors">{{ 'alertmessages.delete' | translate }}</span>
    </button>
  </div>
</div>
