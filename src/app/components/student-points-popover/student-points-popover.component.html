<div class="bg-slate-50" dir="rtl">
  <div class="px-4 py-3 border-b border-slate-100">
    <p class="text-xs text-slate-400 font-medium">{{'popovers.grant_student_points' | translate}}</p>
    <h3 class="text-sm font-bold text-slate-800">{{ student?.name }}</h3>
  </div>

  <div class="flex flex-col py-1 max-h-64 overflow-y-auto">
    @for (point of points; track trackByIndex($index)) {
      <button
        class="flex items-center gap-3 px-4 py-3 text-sm font-bold text-emerald-600 hover:bg-slate-50 transition-colors text-right w-full"
        (click)="dismiss(point)"
      >
        <ion-icon name="add-circle-outline" class="text-xl"></ion-icon> {{ point }}
      </button>
    }
  </div>
</div>
