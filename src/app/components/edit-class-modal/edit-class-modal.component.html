<ion-header class="ion-no-border bg-white rounded-t-3xl" mode="md">
  <ion-toolbar class="--bg-transparent px-2">
    <ion-title class="text-slate-800 font-bold text-base text-center">تعديل بيانات الصف</ion-title>
    <ion-buttons slot="end">
      <button (click)="closeModal()" class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:bg-slate-100 flex items-center justify-center transition-all">
        <ion-icon name="close"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-white">
  <div class="p-5 flex flex-col gap-5" dir="rtl">
    
    <div class="space-y-1.5">
      <div class="flex justify-between items-center px-1">
        <label class="text-xs font-bold text-slate-500">اسم الصف <span class="text-rose-500">*</span></label>
        <span class="text-[10px] font-bold" [ngClass]="editingClass.name?.length === 15 ? 'text-rose-500' : 'text-slate-400'">
            {{ editingClass.name?.length || 0 }} / 15
        </span>
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
        <ion-input type="text" [(ngModel)]="editingClass.name" maxlength="15" class="text-sm text-slate-700 font-bold bg-transparent border-none outline-none" placeholder="أدخل اسم الصف (مثال: أول أ)"></ion-input>
      </div>
    </div>

    <div class="space-y-1.5">
      <div class="flex justify-between items-center px-1">
        <label class="text-xs font-bold text-slate-500">وصف الصف (اختياري)</label>
        <span class="text-[10px] font-bold" [ngClass]="editingClass.desc?.length === 15 ? 'text-rose-500' : 'text-slate-400'">
            {{ editingClass.desc?.length || 0 }} / 15
        </span>
      </div>
      <div class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
        <ion-textarea rows="3" [(ngModel)]="editingClass.desc" maxlength="15" class="text-sm text-slate-700 font-medium bg-transparent border-none outline-none" placeholder="أدخل وصفاً قصيراً للصف"></ion-textarea>
      </div>
    </div>

    <div class="flex flex-col gap-3 mt-4 pt-4 border-t border-slate-50">
      <button class="w-full py-3.5 rounded-2xl font-bold text-white bg-indigo-600 shadow-lg shadow-indigo-200 hover:bg-indigo-700 active:scale-95 transition-all flex items-center justify-center gap-2" (click)="saveChanges()">
        <ion-icon name="save-outline" class="text-xl"></ion-icon> حفظ التعديلات
      </button>
      
      <button class="w-full py-3 rounded-2xl font-bold text-rose-500 bg-rose-50 hover:bg-rose-100 active:scale-95 transition-all flex items-center justify-center gap-2" (click)="deleteClass()">
        <ion-icon name="trash-outline" class="text-xl"></ion-icon> حذف الصف
      </button>
    </div>

  </div>
</ion-content>
