<div class="p-4 bg-white min-w-[200px]" dir="rtl">
  <div class="mb-4 pb-2 border-b border-slate-100">
    <h3 class="text-sm font-bold text-slate-700 m-0 flex items-center gap-2">
      <ion-icon name="print-outline" class="text-indigo-600"></ion-icon>
      {{ 'alertmessages.report_option' | translate }}
    </h3>
  </div>

  <div class="space-y-2">
    <button (click)="close('exel')" 
            class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 transition-all group active:scale-95">
      <div class="w-10 h-10 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors">
        <ion-icon name="document-text-outline" class="text-xl"></ion-icon>
      </div>
      <div class="text-right">
        <p class="text-sm font-bold m-0">{{ 'alertmessages.exel' | translate }}</p>
        <p class="text-3xs opacity-60 m-0">تصدير كجدول بيانات</p>
      </div>
    </button>

    <button (click)="close('pdf')" 
            class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-rose-50 text-slate-600 hover:text-rose-700 transition-all group active:scale-95">
      <div class="w-10 h-10 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center group-hover:bg-rose-600 group-hover:text-white transition-colors">
        <ion-icon name="document-outline" class="text-xl"></ion-icon>
      </div>
      <div class="text-right">
        <p class="text-sm font-bold m-0">{{ 'alertmessages.pdf' | translate }}</p>
        <p class="text-3xs opacity-60 m-0">تصدير كملف جاهز للطباعة</p>
      </div>
    </button>
  </div>
</div>
