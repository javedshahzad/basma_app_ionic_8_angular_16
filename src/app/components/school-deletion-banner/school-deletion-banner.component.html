@if (deleteAt) {
<div class="bg-amber-50 border-b border-amber-200 text-amber-700 p-4 text-center font-bold text-sm shadow-sm">
  <ion-icon name="warning" class="text-2xl mb-1 text-amber-500"></ion-icon>
  <p class="m-0 leading-relaxed">
    {{'setting.deactive_account_text' | translate}} <br />
    <span class="inline-block mt-2 bg-amber-100 text-amber-800 px-3 py-1 rounded-lg border border-amber-200" dir="ltr">
      @if (remainingTime.days > 0) {
      <span>{{remainingTime.days}}D </span>
      } {{remainingTime.hours}}H {{remainingTime.minutes}}M
    </span>
  </p>
  @if (canCancel) {
  <button
    class="mt-3 inline-flex items-center gap-1.5 bg-white border border-amber-300 hover:bg-amber-100 text-amber-800 font-bold text-xs px-4 py-2 rounded-lg transition-all active:scale-95"
    (click)="onCancelClick()"
  >
    <ion-icon name="arrow-undo-outline" class="text-base"></ion-icon>
    {{'setting.revert_deletion' | translate}}
  </button>
  }
</div>
}
