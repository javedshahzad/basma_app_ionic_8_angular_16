<div
  class="flex flex-col h-full bg-slate-50 md:max-w-4xl md:mx-auto md:rounded-3xl md:overflow-hidden md:shadow-2xl"
  dir="rtl"
>
  <div class="bg-slate-50 p-5 flex justify-between items-center shadow-sm z-10 border-b border-slate-100">
    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
      <ion-icon name="color-palette" class="text-indigo-600 bg-indigo-50 p-2.5 rounded-2xl"></ion-icon>
      {{'avatar_images.title' | translate}}
    </h2>
    <button
      class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-rose-100 hover:text-rose-600 transition-all"
      (click)="dismiss()"
    >
      <ion-icon name="close" class="text-2xl"></ion-icon>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto p-6 custom-scrollbar">
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-6 pb-10">
      @for (i of imageList; track trackByIndex($index)) {
        <div
          class="relative aspect-square bg-slate-50 rounded-4xl shadow-sm border-2 p-3 flex items-center justify-center cursor-pointer transition-all duration-300 group"
          [ngClass]="
            selectedImageId === i
              ? 'border-indigo-500 ring-8 ring-indigo-50 scale-90'
              : 'border-white hover:border-indigo-200 hover:shadow-xl hover:-translate-y-1'
          "
          (click)="onSelectImage(i)"
        >
          <img
            loading="lazy"
            [src]="DocUrl + '/uploads/avatar/Asset-' + i + '.png'"
            class="w-full h-full object-contain drop-shadow-lg group-hover:scale-110 transition-transform"
          />
          @if (selectedImageId === i) {
            <div
              class="absolute -top-1 -right-1 bg-indigo-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg border-4 border-white animate-bounce"
            >
              <ion-icon name="checkmark-sharp" class="text-lg font-bold"></ion-icon>
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
