<div class="bg-white" dir="rtl">
  <div class="flex flex-col py-2">
    <button
      class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
      (click)="dismiss('single')"
    >
      <ion-icon name="person-add-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.register_new_student' | translate}}
    </button>
    <button
      class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
      (click)="dismiss('multiple')"
    >
      <ion-icon name="people-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.generate_multiple_students' | translate}}
    </button>
  </div>
</div>
