<div class="p-5 bg-white pb-8" dir="rtl">
  
  <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
    <h4 class="text-lg font-bold text-slate-800 m-0 flex items-center gap-2">
      <ion-icon name="id-card" class="text-indigo-600 bg-indigo-50 p-2 rounded-xl"></ion-icon>
      بيانات الطالب
    </h4>
    <button (click)="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-100 text-slate-500 rounded-full hover:bg-rose-50 hover:text-rose-500 transition-colors">
      <ion-icon name="close" class="text-xl"></ion-icon>
    </button>
  </div>

  <div class="space-y-4 mb-6">
    
    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">{{'setting.phone_one' | translate}}</label>
      <div class="flex items-center gap-2">
        <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all" [ngClass]="{'opacity-60 pointer-events-none bg-slate-100': disabledFileds}">
          <ion-input type="tel" [(ngModel)]="phone" [disabled]="disabledFileds" class="text-sm font-bold text-slate-800 bg-transparent"></ion-input>
        </div>
        <a *ngIf="phone" [href]="'tel:' + phone" class="w-[46px] h-[46px] flex items-center justify-center rounded-xl border transition-all bg-emerald-50 text-emerald-600 border-emerald-200 shadow-sm hover:bg-emerald-500 hover:text-white active:scale-95">
          <ion-icon name="call" class="text-xl"></ion-icon>
        </a>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">{{'setting.phone_two' | translate}}</label>
      <div class="flex items-center gap-2">
        <div class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all" [ngClass]="{'opacity-60 pointer-events-none bg-slate-100': disabledFileds}">
          <ion-input type="tel" [(ngModel)]="phone_no_two" [disabled]="disabledFileds" class="text-sm font-bold text-slate-800 bg-transparent"></ion-input>
        </div>
        <a *ngIf="phone_no_two" [href]="'tel:' + phone_no_two" class="w-[46px] h-[46px] flex items-center justify-center rounded-xl border transition-all bg-emerald-50 text-emerald-600 border-emerald-200 shadow-sm hover:bg-emerald-500 hover:text-white active:scale-95">
          <ion-icon name="call" class="text-xl"></ion-icon>
        </a>
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 mb-2">{{'setting.medical_condition' | translate}}</label>
      <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all" [ngClass]="{'opacity-60 pointer-events-none bg-slate-100': disabledFileds}">
        <ion-input type="text" [(ngModel)]="medical_condition" [disabled]="disabledFileds" class="text-sm font-bold text-slate-800 bg-transparent"></ion-input>
      </div>
    </div>

  </div>

  <div class="flex gap-3 pt-2 border-t border-slate-100">    
    <button *ngIf="!disabledFileds" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md shadow-indigo-200 transition-all active:scale-95 flex items-center justify-center gap-2" (click)="saveChanges()">
      <ion-icon name="save-outline" class="text-lg"></ion-icon>
      حفظ التعديلات
    </button>
  </div>

</div>
