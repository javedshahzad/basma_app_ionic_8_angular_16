<div class="flex flex-col items-center justify-center text-center px-6 py-16" dir="rtl">
  <div
    class="w-16 h-16 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center mb-4 text-rose-500"
  >
    <ion-icon name="cloud-offline-outline" class="text-3xl"></ion-icon>
  </div>
  <p class="text-sm font-bold text-muted max-w-[38ch] leading-relaxed mb-5">{{ message }}</p>
  <button
    (click)="retry.emit()"
    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-sm shadow-indigo-200 transition-all active:scale-95"
  >
    <ion-icon name="refresh-outline" class="text-lg"></ion-icon>
    {{ retryLabel }}
  </button>
</div>
