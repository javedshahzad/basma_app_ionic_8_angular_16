<div class="bg-slate-50" dir="rtl">
  <div class="px-4 py-3 border-b border-slate-100">
    <p class="text-xs text-slate-400 font-medium">{{'popovers.student_actions' | translate}}</p>
    <h3 class="text-sm font-bold text-slate-800">{{ student?.name }}</h3>
  </div>
  <div class="flex flex-col py-1">
    <button class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full" (click)="dismiss('review')">
      <ion-icon name="star-outline" class="text-indigo-600 text-lg"></ion-icon> {{'student-details.student_review' | translate}}
    </button>
    <button class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full" (click)="dismiss('note')">
      <ion-icon name="document-text-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.add_note' | translate}}
    </button>
    <button class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full" (click)="dismiss('points')">
      <ion-icon name="medal-outline" class="text-emerald-600 text-lg"></ion-icon> {{'popovers.student_points' | translate}}
    </button>
  </div>
</div>
