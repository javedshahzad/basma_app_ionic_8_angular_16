<div class="w-full h-full flex items-start justify-center pt-[22vh]" (click)="hideModal()">

  <div class="bg-slate-50 w-11/12 max-w-sm rounded-3xl overflow-hidden shadow-2xl p-6 relative z-10" dir="rtl" (click)="$event.stopPropagation()">

    <h4 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
      <ion-icon name="people" class="text-indigo-600 bg-indigo-50 p-2 rounded-xl"></ion-icon>
      {{ generateLang?.generate_title || 'إنشاء عدة طلاب' }}
    </h4>

    <div class="space-y-4 mb-3">
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2">{{ generateLang?.generate_count_label || 'عدد الطلاب' }}</label>
        <div class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-1 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
          <ion-input
            type="number"
            min="1"
            [max]="maxCount"
            [ngModel]="count()"
            (ngModelChange)="count.set($event)"
            [placeholder]="generateLang?.generate_count_placeholder || 'مثال: 10'"
            class="text-sm text-slate-800 bg-transparent font-medium"
          ></ion-input>
        </div>
      </div>
    </div>

    <div class="mb-6 min-h-[52px]">
      @if (count() && count()! > 0) {
        <div class="bg-indigo-50 border border-indigo-100 rounded-xl px-4 py-3 text-xs font-bold text-indigo-700 flex items-start gap-2">
          <ion-icon name="eye-outline" class="text-sm mt-0.5 shrink-0"></ion-icon>
          <span>{{ generateLang?.generate_preview || 'سيتم إنشاء' }}: {{ generateLang?.generate_word || 'الطالب' }} {{ previewStart() }} … {{ generateLang?.generate_word || 'الطالب' }} {{ previewEnd() }}</span>
        </div>
      }
    </div>

    <div class="flex gap-3">
      <button class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors" (click)="hideModal()">
        {{ generateLang?.cancel || 'إلغاء' }}
      </button>
      <button class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95" (click)="confirm()">
        {{ generateLang?.generate_confirm || 'إنشاء' }}
      </button>
    </div>

  </div>
</div>
