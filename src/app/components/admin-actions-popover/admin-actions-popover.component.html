<div class="bg-white" dir="rtl">
  <div class="flex flex-col py-2">
    @if (canEdit) {
      <button
        class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
        (click)="dismiss('edit')"
      >
        <ion-icon name="create-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.enable_edit_mode' | translate}}
      </button>
    }
    @if (canAdd) {
      <button
        class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
        (click)="dismiss('add')"
      >
        <ion-icon name="person-add-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.register_new_student' | translate}}
      </button>
      <button
        class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
        (click)="dismiss('generate')"
      >
        <ion-icon name="people-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.generate_multiple_students' | translate}}
      </button>
      <button
        class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
        (click)="dismiss('import')"
      >
        <ion-icon name="document-attach-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.import_students_excel' | translate}}
      </button>
    }
    <button
      class="flex items-center gap-3 px-5 py-3 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors text-right w-full"
      (click)="dismiss('notes')"
    >
      <ion-icon name="document-text-outline" class="text-indigo-600 text-lg"></ion-icon> {{'popovers.view_notes' | translate}}
    </button>
  </div>
</div>
