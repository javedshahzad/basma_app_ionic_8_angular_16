<ion-header class="ion-no-border bg-white shadow-sm" mode="md">
  <ion-toolbar class="--bg-transparent px-2">
    <ion-title class="text-slate-800 font-bold text-base text-center">
      {{'parentconnect__newmsg.pagetitle' | translate}}
    </ion-title>
    
    <ion-buttons slot="end">
      <button class="w-8 h-8 rounded-full bg-slate-50 text-slate-500 hover:bg-slate-200 hover:text-rose-500 flex items-center justify-center transition-colors active:scale-95" (click)="dismiss()">
        <ion-icon name="close" class="text-xl"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-slate-50" mode="md"> 
  <div class="p-5 max-w-lg mx-auto space-y-6" dir="rtl">
    
    <form #ticketForm='ngForm' class="space-y-5">
      
      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2 flex items-center gap-1.5">
          <ion-icon name="text-outline" class="text-indigo-500"></ion-icon>
          {{'parentconnect__newmsg.title' | translate}} <span class="text-rose-500">*</span>
        </label>
        <div class="bg-white border border-slate-200 rounded-2xl px-4 py-1.5 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-sm">
          <ion-input placeholder="اكتب عنواناً مختصراً للرسالة..."
                     [(ngModel)]="message.title" name="title" #title='ngModel' required maxlength="35" 
                     class="text-sm font-bold text-slate-800 bg-transparent border-none outline-none m-0">
          </ion-input>
        </div>
      </div>

      <div>
        <label class="block text-sm font-bold text-slate-600 mb-2 flex items-center gap-1.5">
          <ion-icon name="chatbox-ellipses-outline" class="text-indigo-500"></ion-icon>
          {{'parentconnect__newmsg.msg_body' | translate}} <span class="text-rose-500">*</span>
        </label>
        <div class="bg-white border border-slate-200 rounded-2xl px-4 py-2 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-sm">
          <ion-textarea rows="6" placeholder="اكتب تفاصيل رسالتك أو استفسارك هنا..."
                        [(ngModel)]="message.message" name="msg_body" #msg_body='ngModel' required maxlength="140" 
                        class="text-sm font-medium text-slate-700 bg-transparent border-none outline-none m-0 leading-relaxed">
          </ion-textarea>
        </div>
      </div>

      <button *ngIf="ticketImage == ''" type="button" class="w-full bg-indigo-50/50 hover:bg-indigo-50 text-indigo-600 font-bold py-4 rounded-2xl border-2 border-indigo-200 border-dashed transition-all flex items-center justify-center gap-2 active:scale-[0.98]" (click)="takePicture()">
        <ion-icon name="image-outline" class="text-xl"></ion-icon> إرفاق صورة (اختياري)
      </button>

      <div class="relative rounded-2xl overflow-hidden shadow-sm border border-slate-200 bg-white p-1 animate__animated animate__fadeIn" *ngIf="ticketImage != ''">
        <img loading="lazy" [src]="ticketImage" class="w-full h-40 object-cover rounded-xl">
        
        <button type="button" class="absolute top-3 right-3 w-9 h-9 bg-slate-900/50 backdrop-blur-md text-white rounded-xl flex items-center justify-center hover:bg-rose-500 transition-colors shadow-sm" (click)="removeImage()">
          <ion-icon name="trash-outline" class="text-lg"></ion-icon>
        </button>
      </div>

    </form>
  </div>
</ion-content>

<ion-footer class="ion-no-border bg-white shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.1)] relative z-10">
  <div class="p-4 max-w-lg mx-auto">
    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50 disabled:active:scale-100" 
            (click)="sendMessage()" 
            [disabled]="!message.title || !message.message">
      <ion-icon name="send" class="text-xl -rotate-180"></ion-icon> <span>{{'parentconnect__newmsg.send' | translate}}</span>
    </button>
  </div>
</ion-footer>
