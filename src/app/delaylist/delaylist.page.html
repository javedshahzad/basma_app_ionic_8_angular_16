<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    <ion-buttons slot="start" class="menu-btn-container">
      <ion-menu-toggle auto-hide="false">
        <ion-button color="dark" class="custom-menu-btn">
          <ion-icon name="menu-outline"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
    </ion-buttons>
    
    <ion-title class="ion-text-center fw-bold text-dark">
      {{'delaylist.title' | translate}}
    </ion-title>
    
    <ion-buttons slot="end" class="ml-2 w-10"></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md" dir="rtl">
  <div class="p-4 max-w-4xl mx-auto pb-24">
    
    <!-- 🟢 تأثير التحميل الوهمي (Skeleton Loading) -->
    <div class="space-y-3 mt-2" *ngIf="isLoading">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4 animate-pulse" *ngFor="let dummy of [1,2,3,4]">
        <div class="w-14 h-14 bg-slate-200 rounded-2xl shrink-0"></div>
        <div class="flex-1 space-y-3">
          <div class="h-4 bg-slate-200 rounded-md w-1/2"></div>
          <div class="h-3 bg-slate-100 rounded-md w-1/3"></div>
        </div>
      </div>
    </div>

    <!-- 🟢 عرض الفصول في حالة توفر البيانات -->
    <div *ngIf="!isLoading && classes?.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-2">
      
      <div *ngFor="let course of classes" 
           class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center gap-4 cursor-pointer hover:border-indigo-300 hover:shadow-md transition-all active:scale-[0.98] group"
           (click)="openClassStudents(course)">
        
        <!-- أيقونة الفصل الملونة -->
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 relative overflow-hidden">
          <div class="absolute inset-0 opacity-15" [style.background-color]="course.backgroundColor || '#4f46e5'"></div>
          <ion-icon name="time" class="text-2xl z-10" [style.color]="course.backgroundColor || '#4f46e5'"></ion-icon>
        </div>

        <!-- تفاصيل الفصل -->
        <div class="flex-1 overflow-hidden">
          <h3 class="font-bold text-base text-slate-800 m-0 mb-1 truncate">{{course.name}}</h3>
          <p class="text-xs font-medium text-slate-500 m-0 truncate">{{course.desc | translate}}</p>
        </div>

        <!-- أيقونة السهم -->
        <div class="w-8 h-8 rounded-full bg-slate-50 text-slate-400 flex items-center justify-center shrink-0 group-hover:bg-indigo-50 group-hover:text-indigo-600 transition-colors">
          <ion-icon name="chevron-back" class="text-lg"></ion-icon>
        </div>

      </div>

    </div>

    <!-- 🟢 حالة الشاشة الفارغة (No Data) -->
    <div class="text-center py-20" *ngIf="!isLoading && classes?.length === 0">
      <div class="w-24 h-24 bg-slate-100 border border-slate-200 rounded-full flex items-center justify-center mx-auto mb-5 text-slate-400 shadow-inner">
        <ion-icon name="time-outline" class="text-5xl"></ion-icon>
      </div>
      <h3 class="text-lg font-bold text-slate-800 mb-2">لا توجد فصول</h3>
      <p class="text-sm font-medium text-slate-500 max-w-xs mx-auto leading-relaxed">
        {{ noDataFound || 'لم يتم العثور على فصول مسندة إليك لادخال التأخير.' }}
      </p>
    </div>

  </div>
</ion-content>
