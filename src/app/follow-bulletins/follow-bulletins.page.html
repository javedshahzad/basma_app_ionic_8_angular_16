<ion-header class="lineone-header ion-no-border" mode="md">
  <ion-toolbar>
    <ion-buttons slot="end" class="mr-2">
      <ion-back-button defaultHref="/" text="" class="w-10 h-10 rounded-full bg-white border border-slate-200 text-slate-700 shadow-sm hover:bg-slate-100 transition-all flex items-center justify-center"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center fw-bold text-slate-800 text-base">
      {{'bulletin.title' | translate}}
    </ion-title>

    <ion-buttons slot="start" class="w-10 ml-2"></ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-[#f8fafc]" mode="md" dir="rtl">
  
  <div class="max-w-2xl mx-auto p-4 pb-24">
    
    <!-- 🟢 الخطوة 1: رفع الملفات وكتابة العنوان -->
    <div class="animate-fade-in-up" *ngIf="inputText">
      
      <div class="bg-white rounded-[2rem] p-5 shadow-sm border border-slate-200 mb-6">
        <label class="block text-sm font-bold text-slate-600 mb-2 px-1">{{'bulletin.input_title' | translate}} <span class="text-rose-500">*</span></label>
        <div class="bg-slate-50 border border-slate-200 rounded-xl px-4 h-12 flex items-center focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all mb-6">
          <ion-input type="text" [(ngModel)]="tital" placeholder="{{'bulletin.placeholder' | translate}}" class="text-sm font-bold text-slate-800 w-full m-0"></ion-input>  
        </div>

        <input type="file" id="myFileInput" (change)="onSelectFiles($event)" multiple="true" class="hidden" />

        <label class="block text-sm font-bold text-slate-600 mb-3 px-1">الملفات المرفقة <span class="text-rose-500">*</span></label>
        
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          
          <div *ngFor="let doc of selectedDocument; let i=index; trackBy: trackByIndex" class="relative group">
            <div class="aspect-square bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden relative cursor-pointer" (click)="openImgPreview(doc.currentImgSrc)">
              
              <img loading="lazy" src="assets/imgs/pdf.png" *ngIf="doc.extention=='pdf'" class="w-12 h-12 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 object-contain">
              <img loading="lazy" src="assets/imgs/doc.png" *ngIf="['docx','doc','txt'].includes(doc.extention)" class="w-12 h-12 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 object-contain">
              <img loading="lazy" [src]="doc.currentImgSrc" *ngIf="['png','jpg','jpeg'].includes(doc.extention)" class="w-full h-full object-cover">
              <img loading="lazy" src="assets/imgs/pdssf.png" *ngIf="!['png','jpg','jpeg','docx','doc','txt','pdf'].includes(doc.extention)" class="w-12 h-12 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 object-contain">
              
              <div class="absolute bottom-0 left-0 right-0 bg-black/60 backdrop-blur-sm p-1.5 truncate text-white text-[10px] font-medium text-center">
                {{doc.name}}
              </div>
            </div>
            
            <button (click)="removeImage(i)" class="absolute -top-2 -right-2 w-8 h-8 bg-rose-500 text-white rounded-full flex items-center justify-center shadow-md shadow-rose-200 hover:bg-rose-600 transition-all z-10 active:scale-95">
              <ion-icon name="close" class="text-xl"></ion-icon>
            </button>
          </div>

          <!-- زر الإضافة -->
          <div class="aspect-square border-2 border-dashed border-indigo-200 rounded-2xl flex flex-col items-center justify-center bg-indigo-50/50 text-indigo-500 cursor-pointer hover:bg-indigo-50 transition-colors active:scale-95" (click)="scanDocument()">
            <ion-icon name="cloud-upload-outline" class="text-3xl mb-1"></ion-icon>
            <span class="text-xs font-bold">أضف ملف</span>
          </div>

        </div>
      </div>

    </div>

    <!-- 🟢 الخطوة 2: اختيار المستخدمين للإرسال -->
    <div class="animate-fade-in-up" *ngIf="inputUser">
      
      <div class="bg-white rounded-2xl p-2 border border-slate-200 flex items-center focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-100 transition-all shadow-sm mb-4 sticky top-4 z-10">
        <ion-icon name="search-outline" class="text-slate-400 mx-2 text-xl"></ion-icon>
        <input type="text" [(ngModel)]="searchQuery" (keyup)="filterList()" placeholder="{{'search.search_user' | translate}}" class="w-full bg-transparent border-none outline-none text-sm font-bold text-slate-700 placeholder-slate-400 h-10">
      </div>

      <div *ngIf="uploadStaus" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-4 text-center">
        <h4 class="text-slate-600 font-bold text-sm mb-3">جاري رفع الملفات... {{uploadStaus}}%</h4>
        <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
          <div class="bg-indigo-600 h-full rounded-full transition-all duration-300" [style.width.%]="uploadStaus"></div>
        </div>
      </div>

      <div *ngIf="show_loading" class="space-y-3">
        <div *ngFor="let dummy of [1,2,3,4,5]; trackBy: trackByIndex" class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-3 animate-pulse">
          <div class="w-12 h-12 bg-slate-200 rounded-full"></div>
          <div class="flex-1 space-y-2">
            <div class="h-4 bg-slate-200 rounded w-1/2"></div>
            <div class="h-3 bg-slate-200 rounded w-1/3"></div>
          </div>
          <div class="w-6 h-6 bg-slate-200 rounded"></div>
        </div>
      </div>

      <div *ngIf="!uploadStaus && !show_loading" class="space-y-3">
        <div *ngFor="let users of allUsers; trackBy: trackByIndex" class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between hover:shadow-md transition-shadow cursor-pointer">
          <div class="flex items-center gap-3">
            <img loading="lazy" [src]="users.pic" onerror="this.onerror=null;this.src='assets/imgs/default_avatar.png';" class="w-12 h-12 rounded-full object-cover border border-slate-100 shadow-sm bg-slate-50">
            <div>
              <h4 class="text-sm font-bold text-slate-800 m-0 mb-0.5">{{users.first_name}}</h4>
              <p class="text-xs font-medium text-slate-500 m-0" dir="ltr">{{users.username}}</p> 
            </div>
          </div>
          <ion-checkbox mode="ios" (ionChange)="selectUser(users, $event)" class="--border-radius-sm border-indigo-200 checked:bg-indigo-600"></ion-checkbox>
        </div>
      </div>
      
      <ion-infinite-scroll (ionInfinite)="doInfinite($event)">
          <ion-infinite-scroll-content></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border bg-white shadow-[0_-10px_30px_-15px_rgba(0,0,0,0.1)] rounded-t-3xl" *ngIf="!uploadStaus">
  <div class="p-5 max-w-2xl mx-auto pb-safe">
    
    <button *ngIf="!inputUser" 
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center gap-2 disabled:opacity-50" 
            (click)="openUser()" 
            [disabled]="selectedDocument.length == 0 || tital == ''">
      {{'bulletin.select_user' | translate}}
      <ion-icon name="arrow-back-outline" class="text-xl"></ion-icon>
    </button>

    <button *ngIf="inputUser" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-base py-3.5 rounded-2xl shadow-lg shadow-emerald-200 transition-all active:scale-[0.98] flex justify-center items-center gap-2 disabled:opacity-50" 
            (click)="submit()" 
            [disabled]="selectedUsers.length == 0">
      <ion-icon name="paper-plane-outline" class="text-xl transform -rotate-45"></ion-icon>
      {{'bulletin.share' | translate}}
    </button>

  </div>
</ion-footer>
